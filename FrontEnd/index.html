<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaceship War - Play. Earn. Own Forever.</title>
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background-start-rgb: 10, 5, 5;
        --background-end-rgb: 49, 10, 3;
        --foreground-rgb: 239, 235, 220;
        --primary-rgb: 255, 120, 30; /* Fiery Orange */
        --accent-rgb: 217, 48, 32; /* Mars Red */
      }

      body {
        font-family: 'Rajdhani', sans-serif;
        background-color: rgb(var(--background-start-rgb));
        color: rgb(var(--foreground-rgb));
      }
      .font-orbitron {
        font-family: 'Orbitron', sans-serif;
      }
      .neon-glow-primary {
        box-shadow: 0 0 5px rgba(var(--primary-rgb), 0.8),
          0 0 10px rgba(var(--primary-rgb), 0.6),
          0 0 15px rgba(var(--primary-rgb), 0.4);
      }
      .neon-text-primary {
        text-shadow: 0 0 5px rgba(var(--primary-rgb), 0.7),
          0 0 10px rgba(var(--primary-rgb), 0.5);
      }
      .neon-text-accent {
        text-shadow: 0 0 5px rgba(var(--accent-rgb), 0.7),
          0 0 10px rgba(var(--accent-rgb), 0.5);
      }
      .glass-effect {
        background: rgba(20, 10, 10, 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(var(--primary-rgb), 0.15);
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      .animate-fade-out-up {
        animation: fadeOutUp 0.3s ease-in forwards;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeOutUp {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(-10px);
        }
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-[rgb(var(--background-start-rgb))] via-black to-[rgb(var(--background-end-rgb))]"
  >
    <app-root></app-root>
  </body>
</html>
