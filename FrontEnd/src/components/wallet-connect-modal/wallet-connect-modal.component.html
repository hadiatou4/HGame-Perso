@if (isOpen()) {
<div
  class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 backdrop-blur-sm"
  (click)="closeModal()"
>
  <div
    class="glass-effect rounded-2xl p-8 md:p-12 text-center border-2 border-[rgba(var(--primary-rgb),0.3)] w-full max-w-md mx-4"
    (click)="$event.stopPropagation()"
  >
    <h2 class="text-4xl font-orbitron font-bold mb-4 neon-text-primary">
      Welcome, Pilot!
    </h2>
    <p class="text-neutral-300 mb-8">
      Connect your Hedera wallet to enter the war zone.
    </p>

    @if (walletState().status !== 'connecting') {
    <button
      (click)="connectWallet()"
      class="w-full bg-[rgb(var(--primary-rgb))] text-black font-bold text-xl py-4 px-6 rounded-lg hover:bg-[rgba(var(--primary-rgb),0.85)] transition-all duration-300 neon-glow-primary transform hover:scale-105"
    >
      Connect (Simulated)
    </button>
    <p class="text-xs text-neutral-500 mt-4">
      This is a simulated connection. In a real app, you would connect to
      HashPack or another Hedera wallet.
    </p>
    } @else {
    <div
      class="flex items-center justify-center space-x-4 text-[rgb(var(--primary-rgb))] text-xl"
    >
      <svg
        class="animate-spin h-8 w-8 text-[rgb(var(--primary-rgb))]"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
        ></path>
      </svg>
      <span>Connecting & Syncing Profile...</span>
    </div>
    }
  </div>
</div>
}
