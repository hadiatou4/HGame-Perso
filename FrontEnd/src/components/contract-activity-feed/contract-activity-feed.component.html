<div class="container mx-auto max-w-4xl">
  <div class="text-center mb-8">
    <h1 class="text-4xl font-orbitron font-bold neon-text-accent">Contract Activity Feed</h1>
    <p class="text-neutral-400 mt-2">Live feed of on-chain events.</p>
  </div>
  
  <div class="glass-effect rounded-lg p-4 font-mono text-sm h-[60vh] overflow-y-auto">
    <div class="flex flex-col-reverse">
      @for(activity of activities(); track activity.txId) {
        <div class="p-3 border-b border-[rgba(var(--primary-rgb),0.1)] hover:bg-[rgba(var(--primary-rgb),0.05)] transition-colors duration-200">
          <div class="flex justify-between items-center">
            <div class="flex items-center space-x-4">
              <span [class]="getStatusColor(activity.status)" class="px-2 py-1 rounded-md text-xs font-bold">{{ activity.status }}</span>
              <span class="text-[rgb(var(--accent-rgb))] font-bold w-28">{{ activity.type }}</span>
              <span class="text-neutral-300">{{ activity.payload }}</span>
            </div>
            <div class="text-neutral-500 text-xs text-right min-w-[150px]">
              <div>{{ activity.timestamp | date:'medium' }}</div>
              <div class="truncate" title="{{activity.txId}}">{{ activity.txId.slice(0, 36) }}...</div>
            </div>
          </div>
        </div>
      } @empty {
        <div class="text-center text-neutral-500 p-8">Awaiting network activity...</div>
      }
    </div>
  </div>
</div>
