<div
  class="fixed inset-0 w-screen h-screen z-50 bg-black overflow-hidden flex flex-col"
>
  <!-- Exit Button -->
  <button
    (click)="exitGame()"
    class="absolute bottom-4 left-4 z-[10000] flex items-center gap-2 bg-red-600/70 text-white font-bold py-2 px-4 rounded-lg border border-red-500/80 hover:bg-red-500 transition-colors duration-300"
  >
    Leave Battle
  </button>

  <!-- Fullscreen Game Iframe -->
  <iframe
    src="http://localhost:4500"
    class="w-full h-full border-none"
    allow="fullscreen"
    sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-modals"
  ></iframe>
</div>
